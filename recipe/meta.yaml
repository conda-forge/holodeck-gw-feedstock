{% set name = "holodeck-gw" %}
{% set version = "1.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 440767f35d43a90a49f302cbf652f793998a38b3e32f440adc57d16f5794b741

build:
  skip: true  # [py<39 or win]
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - setuptools >=40.6.0
    - wheel
    - cython <3.0.0
    - numpy <2.0.0
    - scipy
    - numba
    - pip
    - mpi4py
  run:
    - python
    - kalepy
    - astropy
    - cosmopy
    - h5py
    - matplotlib-base
    - scipy
    - pydoe
    - psutil
    - ipywidgets
    - tqdm
    - schwimmbad
    - emcee
    - george
    - numba
    - mpi4py
    - sympy
    - healpy
    - hasasia

test:
  imports:
    - holodeck
  requires:
    - openssh  # [unix]

about:
  home: https://github.com/NANOGrav/holodeck/
  summary: 'holodeck: Massive black hole (MBH) binary simulator for pulsar timing array signals.'
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - davecwright3
